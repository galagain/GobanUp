name: gobanup
services:
  web:
    build: .
    restart: unless-stopped
    volumes:
      - goban-data:/data
    ports:
      - "127.0.0.1:8093:8093"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8093/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options: {max-size: 10m, max-file: "3"}
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    user: "1000:1000"
    command: [tunnel, --config, /etc/cloudflared/config.yml, run]
    volumes:
      - ./deploy/tunnel.yml:/etc/cloudflared/config.yml:ro
      - ./deploy/tunnel-credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      web: {condition: service_healthy}
    cap_drop: [ALL]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    logging:
      options: {max-size: 10m, max-file: "3"}
volumes:
  goban-data:
